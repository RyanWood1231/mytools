<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 聊天工具</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body, html { height: 100%; font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e3e3e3; }

  .chat-container {
    max-width: 600px;
    height: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* 聊天区 */
  #chatHistory {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .message {
    max-width: 70%;
    padding: 10px 15px;
    border-radius: 20px;
    word-wrap: break-word;
    line-height: 1.4;
    display: inline-block;
  }
  .user { background:#61dafb; color:#000; margin-left:auto; text-align:right; border-bottom-right-radius:5px; border-bottom-left-radius:20px;}
  .ai { background:#1c1f26; color:#fff; margin-right:auto; text-align:left; border-bottom-left-radius:5px; border-bottom-right-radius:20px;}

  /* 初始居中输入框 */
  #initialInput {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 500px;
    display: flex;
    gap: 10px;
  }
  #initialInput textarea { flex:1; resize:none; border-radius:10px; border:none; padding:8px; font-size:1rem; background:#1c1f26; color:#e3e3e3; }

  /* 底部输入框 */
  .input-area {
    display: flex;
    padding: 10px;
    background:#1c1f26;
    border-top-left-radius:10px;
    border-top-right-radius:10px;
  }
  .input-area textarea {
    flex:1;
    resize:none;
    border-radius:10px;
    border:none;
    padding:8px;
    font-size:1rem;
    background:#1c1f26;
    color:#e3e3e3;
  }
  .input-area button {
    margin-left:10px;
    padding:10px 15px;
    font-size:1rem;
    border:none;
    border-radius:10px;
    background:#61dafb;
    color:#000;
    cursor:pointer;
    font-weight:bold;
  }
</style>
</head>
<body>

<div class="chat-container">
  <div id="chatHistory"></div>

  <!-- 初始居中输入框 -->
  <div id="initialInput">
    <textarea id="promptInput" rows="1" placeholder="请输入消息..."></textarea>
    <button onclick="sendMessage()">发送</button>
  </div>

  <!-- 底部输入框 -->
  <div class="input-area" id="bottomInput" style="display:none;">
    <textarea id="promptInputBottom" rows="1" placeholder="请输入消息..."></textarea>
    <button onclick="sendMessageBottom()">发送</button>
  </div>
</div>

<script>
const chatHistoryDiv = document.getElementById("chatHistory");
const initialInputDiv = document.getElementById("initialInput");
const bottomInputDiv = document.getElementById("bottomInput");
const promptInput = document.getElementById("promptInput");
const promptInputBottom = document.getElementById("promptInputBottom");

let chatHistory = [];

async function sendMessage() {
    const prompt = promptInput.value.trim();
    if(!prompt) return;

    chatHistory.push({role:"user", content:prompt});
    updateChatUI();

    // 切换输入框
    initialInputDiv.style.display="none";
    bottomInputDiv.style.display="flex";
    promptInputBottom.focus();

    await sendToBackend();
}

async function sendMessageBottom() {
    const prompt = promptInputBottom.value.trim();
    if(!prompt) return;

    chatHistory.push({role:"user", content:prompt});
    updateChatUI();
    promptInputBottom.value = "";
    promptInputBottom.focus();

    await sendToBackend();
}

function updateChatUI() {
    chatHistoryDiv.innerHTML = chatHistory.map(m => `<div class="message ${m.role}">${m.content}</div>`).join("");
    chatHistoryDiv.scrollTop = chatHistoryDiv.scrollHeight;
}

async function sendToBackend() {
    try {
        const response = await fetch("https://ai-excel-automation.onrender.com/excel-ai", {
            method:"POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({chatHistory})
        });
        if(!response.ok) {
            chatHistory.push({role:"ai", content:`❌ API 错误 ${response.status}`});
            updateChatUI();
            return;
        }
        const data = await response.json();
        chatHistory.push({role:"ai", content:data.result || "未返回结果"});
        updateChatUI();
    } catch(error) {
        chatHistory.push({role:"ai", content:`❌ 请求异常: ${error}`});
        updateChatUI();
    }
}

// 回车发送
promptInput.addEventListener("keypress", function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}});
promptInputBottom.addEventListener("keypress", function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessageBottom();}});
</script>

</body>
</html>
