<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Excel 处理工具</title>
  <link rel="icon" href="Logo.png" type="image/png" />
  <link rel="stylesheet" href="style.css" />
  <style>

  * { box-sizing: border-box; margin:0; padding:0; }
  body, html { height: 100%; font-family: 'Segoe UI', sans-serif; background: transparent; color: #e3e3e3; }

  .chat-container {
    max-width: 600px;
    height: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* 聊天区 */
  #chatHistory {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .message {
    max-width: 70%;
    padding: 10px 15px;
    border-radius: 20px;
    word-wrap: break-word;
    line-height: 1.4;
    display: inline-block;
  }
  .user { background: transparent; color:#000; margin-left:auto; text-align:right; border-bottom-right-radius:5px; border-bottom-left-radius:20px;}
  .ai { background: transparent; color:#fff; margin-right:auto; text-align:left; border-bottom-left-radius:5px; border-bottom-right-radius:20px;}

  /* 初始居中输入框 */
  #initialInput {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 500px;
    display: flex;
    gap: 10px;
  }
  #initialInput textarea { flex:1; resize:none; border-radius:10px; border:none; padding:8px; font-size:1rem; background: transparent; color:#e3e3e3; }

  /* 底部输入框 */
  .input-area {
    display: flex;
    padding: 10px;
    background: transparent;
    border-top-left-radius:10px;
    border-top-right-radius:10px;
  }
  .input-area textarea {
    flex:1;
    resize:none;
    border-radius:10px;
    border:none;
    padding:8px;
    font-size:1rem;
    background: transparent;
    color:#e3e3e3;
  }
  .input-area button {
    margin-left:10px;
    padding:10px 15px;
    font-size:1rem;
    border:none;
    border-radius:10px;
    background: transparent;
    color:#000;
    cursor:pointer;
    font-weight:bold;
  }

  </style>
</head>
<body class="tool-page">
  <header class="topbar">
    <div class="container topbar__inner">
      <a class="brand" href="index.html" aria-label="Home">
        <span class="brand__dot" aria-hidden="true"></span>
        <span id="brandText">Ryan • Automation</span>
      </a>

      <nav class="navlinks" aria-label="Primary">
        <a id="navTools" href="index.html#tools">Tools</a>
        <a id="navAbout" href="about.html">About</a>
        <a id="navContact" href="index.html#contact">Contact</a>
      </nav>

      <div class="topbar__actions">
        <button id="langToggleBtn" class="pill" type="button">English</button>
        <button id="themeToggleBtn" class="pill" type="button">切换主题</button>
        <button id="authorBtn" class="pill pill--solid" type="button">作者信息</button>
      </div>
    </div>
  </header>

  <main class="tool-shell">
    <div class="tool-surface">
      
<div class="chat-container">
<div id="chatHistory"></div>
<!-- 初始居中输入框 -->
<div id="initialInput">
<textarea id="promptInput" placeholder="请输入消息..." rows="1"></textarea>
<button onclick="sendMessage()">发送</button>
</div>
<!-- 底部输入框 -->
<div class="input-area" id="bottomInput" style="display:none;">
<textarea id="promptInputBottom" placeholder="请输入消息..." rows="1"></textarea>
<button onclick="sendMessageBottom()">发送</button>
</div>
</div>
<script>
const chatHistoryDiv = document.getElementById("chatHistory");
const initialInputDiv = document.getElementById("initialInput");
const bottomInputDiv = document.getElementById("bottomInput");
const promptInput = document.getElementById("promptInput");
const promptInputBottom = document.getElementById("promptInputBottom");

let chatHistory = [];

async function sendMessage() {
    const prompt = promptInput.value.trim();
    if(!prompt) return;

    chatHistory.push({role:"user", content:prompt});
    updateChatUI();

    // 切换输入框
    initialInputDiv.style.display="none";
    bottomInputDiv.style.display="flex";
    promptInputBottom.focus();

    await sendToBackend();
}

async function sendMessageBottom() {
    const prompt = promptInputBottom.value.trim();
    if(!prompt) return;

    chatHistory.push({role:"user", content:prompt});
    updateChatUI();
    promptInputBottom.value = "";
    promptInputBottom.focus();

    await sendToBackend();
}

function updateChatUI() {
    chatHistoryDiv.innerHTML = chatHistory.map(m => `<div class="message ${m.role}">${m.content}</div>`).join("");
    chatHistoryDiv.scrollTop = chatHistoryDiv.scrollHeight;
}

async function sendToBackend() {
    try {
        const response = await fetch("https://ai-excel-automation.onrender.com/excel-ai", {
            method:"POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({chatHistory})
        });
        if(!response.ok) {
            chatHistory.push({role:"ai", content:`❌ API 错误 ${response.status}`});
            updateChatUI();
            return;
        }
        const data = await response.json();
        chatHistory.push({role:"ai", content:data.result || "未返回结果"});
        updateChatUI();
    } catch(error) {
        chatHistory.push({role:"ai", content:`❌ 请求异常: ${error}`});
        updateChatUI();
    }
}

// 回车发送
promptInput.addEventListener("keypress", function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}});
promptInputBottom.addEventListener("keypress", function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessageBottom();}});
</script>

    </div>
  </main>

  <!-- Author modal -->
  <div id="authorModal" class="modal" aria-hidden="true">
    <div id="authorModalContent" class="modal__content" role="dialog" aria-modal="true" aria-labelledby="authorTitle">
      <div class="modal__head">
        <h3 id="authorTitle">关于作者</h3>
        <button id="authorClose" class="modal__close" aria-label="Close">✕</button>
      </div>
      <p id="authorText" class="modal__body">嗨，这里是 Ryan。</p>
      <div class="modal__actions">
        <a class="btn btn--yellow" href="index.html#contact">Contact</a>
        <a class="btn btn--ghost" href="index.html#tools">Tools</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
