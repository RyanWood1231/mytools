<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>我的工具站</title>
  <link rel="icon" href="Logo.png" type="image/png" />

  <style>
    body {
      background-color: #0f1117;
      color: #e3e3e3;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 2rem;
      transition: background-color 0.3s, color 0.3s;
    }
    body.light-mode {
      background-color: #f5f5f5;
      color: #222;
    }
    h1 {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    #searchInput {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 2rem;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .tool-card {
      background: #1c1f26;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      transition: background 0.3s, color 0.3s;
    }
    body.light-mode .tool-card {
      background: #ffffff;
      color: #222;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .tool-card h2 { margin: 0; }

    .tool-card a.tool-link {
      color: #61dafb;
      text-decoration: none;
      transition: color 0.3s, opacity 0.2s;
      font-weight: 600;
    }
    body.light-mode .tool-card a.tool-link { color: #007acc; }

    /* disabled / coming soon */
    .tool-card a.tool-link.disabled {
      pointer-events: none;
      opacity: 0.55;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    /* 顶部按钮容器 */
    #buttonContainer {
      position: fixed;
      top: 20px;
      left: 20px;
      display: flex;
      gap: 10px;
      z-index: 1000;
    }
    #buttonContainer button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s, color 0.3s;
    }
    #langToggleBtn { background: #888; color: #fff; }
    body.light-mode #langToggleBtn { background: #555; color: #eee; }

    #themeToggleBtn { background: #61dafb; color: #0f1117; }
    body.light-mode #themeToggleBtn { background: #007acc; color: #fff; }

    #authorBtn { background: #444; color: #fff; }
    body.light-mode #authorBtn { background: #222; color: #eee; }

    /* 模态框 */
    #authorModal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.6);
    }
    #authorModal.light-mode { background-color: rgba(255,255,255,0.8); }

    #authorModalContent {
      background-color: #1c1f26;
      margin: 10% auto;
      padding: 2rem;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      color: #e3e3e3;
      position: relative;
      transition: background-color 0.3s, color 0.3s;
    }
    #authorModal.light-mode #authorModalContent {
      background-color: #fff;
      color: #222;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    #authorClose {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 1.5rem;
      font-weight: bold;
      color: inherit;
      cursor: pointer;
    }
    #authorClose:hover { color: #61dafb; }

    @media (max-width: 640px) {
      body { padding-top: 5rem; }
      #buttonContainer { top: 12px; left: 12px; }
      h1 { font-size: 2rem; }
    }
  </style>
</head>

<body>
  <div id="buttonContainer">
    <button id="langToggleBtn" type="button">English</button>
    <button id="themeToggleBtn" type="button">切换主题</button>
    <button id="authorBtn" type="button">作者信息</button>
  </div>

  <h1 id="pageTitle">我的工具站</h1>
  <input type="text" id="searchInput" placeholder="搜索工具..." />

  <!-- 工具列表：由 JS 渲染 -->
  <div id="toolsContainer"></div>

  <!-- 作者信息模态框 -->
  <div id="authorModal">
    <div id="authorModalContent">
      <span id="authorClose" title="关闭">&times;</span>
      <h2 id="authorTitle">关于作者</h2>
      <p id="authorText">嗨，这里是Ryan。</p>
    </div>
  </div>

  <script>
    /*****************************************************************
     * A) 工具“公共信息”只写一份：id/icon/href/enabled（无需翻译）
     *****************************************************************/
    const toolsBase = [
      { id: "excel_ai",       icon: "📊", href: "excel_ai.html", enabled: true  },
      { id: "excel_cleanup",  icon: "🔧", href: "https://github.com/yourusername/excel-cleanup-tool", enabled: false },
      { id: "batch_copier",   icon: "🐍", href: "https://mytools-d4exbdecqsrzidtgsmoy7e.streamlit.app/", enabled: true },
      { id: "order_tracking", icon: "📦", href: "order_tracking.html", enabled: true },
      { id: "smartwear26",    icon: "👕", href: "SmartWear26.html", enabled: true }
    ];

    /*****************************************************************
     * B) 所有文本翻译集中管理（包括工具 title/desc/linkText）
     *****************************************************************/
    const i18n = {
      cn: {
        htmlLang: "zh-CN",
        pageTitle: "我的工具站",
        searchPlaceholder: "搜索工具...",
        buttons: {
          langTo: "English",
          theme: "切换主题",
          author: "作者信息"
        },
        author: {
          title: "关于作者",
          text: "嗨，这里是Ryan。"
        },
        // 工具翻译：key 用工具 id
        toolsText: {
          excel_ai: {
            title: "AI Excel处理工具",
            desc: "上传Excel或输入需求，让AI帮你清洗、处理数据。",
            linkText: "打开工具 🚀"
          },
          excel_cleanup: {
            title: "Excel自动整理工具",
            desc: "用于整理数据，去除空行并格式化。",
            linkText: "暂未开放"
          },
          batch_copier: {
            title: "Python根据关键词文件批量复制",
            desc: "根据关键词批量复制文件到指定文件夹的小工具。",
            linkText: "在线打开工具 🚀"
          },
          order_tracking: {
            title: "订单追踪工具",
            desc: "输入订单号并查询当前状态的网页小工具。",
            linkText: "在线使用工具 🚀"
          },
          smartwear26: {
            title: "智能穿衣推荐",
            desc: "输入城市名（英文）并查询当前天气以及穿衣推荐的小工具。",
            linkText: "在线使用工具 🚀"
          }
        }
      },

      en: {
        htmlLang: "en",
        pageTitle: "My Tools",
        searchPlaceholder: "Search tools...",
        buttons: {
          langTo: "中文",
          theme: "Toggle Theme",
          author: "Author Info"
        },
        author: {
          title: "About Author",
          text: "Hi, this is Ryan."
        },
        toolsText: {
          excel_ai: {
            title: "AI Excel Processor",
            desc: "Upload Excel or enter instructions to let AI process data.",
            linkText: "Open Tool 🚀"
          },
          excel_cleanup: {
            title: "Excel Cleanup Tool",
            desc: "Organize data, remove blank lines and format.",
            linkText: "Coming Soon"
          },
          batch_copier: {
            title: "Python Batch File Copier",
            desc: "Copy files by keywords in batch to target folder.",
            linkText: "Open Online 🚀"
          },
          order_tracking: {
            title: "Order Tracking Tool",
            desc: "Input order number to track current status.",
            linkText: "Use Tool Online 🚀"
          },
          smartwear26: {
            title: "Smart Wear 26",
            desc: "Input city name to get clothing recommendations.",
            linkText: "Use Tool Online 🚀"
          }
        }
      }
    };

    /*****************************************************************
     * C) 状态 & 本地存储 key
     *****************************************************************/
    const LS_KEYS = { theme: "theme", lang: "lang" };
    let currentLang = localStorage.getItem(LS_KEYS.lang) || "cn";

    /*****************************************************************
     * D) 工具函数：安全取翻译（防止漏写导致报错）
     *****************************************************************/
    function tTool(toolId) {
      const dict = i18n[currentLang];
      const fallbackLang = currentLang === "cn" ? "en" : "cn";
      return (
        dict.toolsText[toolId] ||
        i18n[fallbackLang].toolsText[toolId] ||
        { title: toolId, desc: "", linkText: "" }
      );
    }

    /*****************************************************************
     * E) 渲染工具卡：用 toolsBase + 当前语言翻译合并
     *****************************************************************/
    function renderTools() {
      const container = document.getElementById("toolsContainer");
      container.innerHTML = "";

      toolsBase.forEach(base => {
        const text = tTool(base.id);

        const card = document.createElement("div");
        card.className = "tool-card";
        card.dataset.id = base.id;

        const h2 = document.createElement("h2");
        h2.className = "tool-title";
        h2.textContent = `${base.icon} ${text.title}`;

        const pDesc = document.createElement("p");
        pDesc.className = "tool-desc";
        pDesc.textContent = text.desc;

        const pLink = document.createElement("p");
        const a = document.createElement("a");
        a.className = "tool-link";
        a.textContent = text.linkText;

        if (base.enabled) {
          a.href = base.href;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
        } else {
          a.href = "javascript:void(0)";
          a.classList.add("disabled");
          a.setAttribute("aria-disabled", "true");
        }

        pLink.appendChild(a);
        card.appendChild(h2);
        card.appendChild(pDesc);
        card.appendChild(pLink);
        container.appendChild(card);
      });
    }

    /*****************************************************************
     * F) 搜索过滤：按当前语言的 title+desc 过滤
     *****************************************************************/
    function filterTools() {
      const kw = document.getElementById("searchInput").value.trim().toLowerCase();
      const cards = Array.from(document.querySelectorAll(".tool-card"));

      // 生成当前语言下的检索文本 map
      const map = new Map(
        toolsBase.map(b => {
          const text = tTool(b.id);
          return [b.id, (text.title + " " + text.desc).toLowerCase()];
        })
      );

      cards.forEach(card => {
        const id = card.dataset.id;
        const text = map.get(id) || "";
        card.style.display = text.includes(kw) ? "block" : "none";
      });
    }

    /*****************************************************************
     * G) 主题
     *****************************************************************/
    function applyThemeFromStorage() {
      const theme = localStorage.getItem(LS_KEYS.theme) || "dark";
      const light = theme === "light";
      document.body.classList.toggle("light-mode", light);
      document.getElementById("authorModal").classList.toggle("light-mode", light);
    }

    function toggleTheme() {
      const isLight = document.body.classList.contains("light-mode");
      document.body.classList.toggle("light-mode", !isLight);
      document.getElementById("authorModal").classList.toggle("light-mode", !isLight);
      localStorage.setItem(LS_KEYS.theme, !isLight ? "light" : "dark");
    }

    /*****************************************************************
     * H) 语言应用（所有固定文本 + 重新渲染工具）
     *****************************************************************/
    function applyLanguage() {
      const dict = i18n[currentLang];

      document.documentElement.lang = dict.htmlLang;
      document.getElementById("pageTitle").textContent = dict.pageTitle;
      document.getElementById("searchInput").placeholder = dict.searchPlaceholder;

      document.getElementById("langToggleBtn").textContent = dict.buttons.langTo;
      document.getElementById("themeToggleBtn").textContent = dict.buttons.theme;
      document.getElementById("authorBtn").textContent = dict.buttons.author;

      document.getElementById("authorTitle").textContent = dict.author.title;
      document.getElementById("authorText").textContent = dict.author.text;

      renderTools();
      filterTools(); // 保持搜索结果正确
      localStorage.setItem(LS_KEYS.lang, currentLang);
    }

    function toggleLanguage() {
      currentLang = (currentLang === "cn") ? "en" : "cn";
      applyLanguage();
    }

    /*****************************************************************
     * I) 模态框
     *****************************************************************/
    function openAuthorModal() {
      document.getElementById("authorModal").style.display = "block";
    }
    function closeAuthorModal() {
      document.getElementById("authorModal").style.display = "none";
    }

    /*****************************************************************
     * J) 事件绑定 & 启动
     *****************************************************************/
    document.getElementById("langToggleBtn").addEventListener("click", toggleLanguage);
    document.getElementById("themeToggleBtn").addEventListener("click", toggleTheme);
    document.getElementById("authorBtn").addEventListener("click", openAuthorModal);

    document.getElementById("authorClose").addEventListener("click", closeAuthorModal);
    document.getElementById("authorModal").addEventListener("click", (e) => {
      if (e.target.id === "authorModal") closeAuthorModal();
    });

    document.getElementById("searchInput").addEventListener("input", filterTools);

    // 启动
    applyThemeFromStorage();
    applyLanguage();
  </script>
</body>
</html>
