<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="docTitle">SmartWear 26</title>
  <link rel="icon" href="Logo.png" type="image/png" />
  <link rel="stylesheet" href="style.css" />
</head>

<body class="tool-page smartwear">
  <header class="topbar">
    <div class="container topbar__inner">
      <a class="brand" href="index.html" aria-label="Home">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__text" id="brandText">Ryan Studio</span>
      </a>

      <!-- ✅ 关键：id 改成 app.js 认识的 navTools / navServices / navContact -->
      <nav class="navlinks" aria-label="Primary">
        <a class="navlink" id="navTools" href="index.html#tools">Tools</a>
        <a class="navlink" id="navServices" href="about.html">About</a>
        <a class="navlink" id="navContact" href="index.html#contact">Contact</a>
      </nav>

      <div class="topbar__actions">
        <button id="langToggleBtn" class="pill" type="button">English</button>
        <button id="themeToggleBtn" class="pill" type="button">切换主题</button>
        <button id="authorBtn" class="pill pill--solid" type="button">作者信息</button>
      </div>
    </div>
  </header>

  <main class="tool-shell">
    <div class="container">
      <div class="tool-surface tool-surface--light">
        <h1 class="pageTitle">26℃ 穿衣助手</h1>
        <p class="mutedText">
          输入城市（自动查天气）或手动输入温度。
        </p>

        <div class="grid">
          <!-- Preferences -->
          <section class="card" aria-label="Preferences">
            <div class="row">
              <label class="tag" for="styleSelect">风格偏好</label>
              <select id="styleSelect" class="field" style="max-width: 260px;">
                <option value="any" selected>通用（不限制）</option>
                <option value="minimal">极简</option>
                <option value="commute">通勤</option>
                <option value="sporty">运动</option>
                <option value="street">街头</option>
                <option value="outdoor">户外</option>
              </select>

              <span class="tag" title="下雨时会更偏向防水外套/雨具">雨天加权</span>
              <span class="mutedText">风格偏好功能正在开发中，敬请期待~</span>
            </div>
          </section>

          <!-- City weather -->
          <section class="card" aria-label="City weather">
            <h3 style="margin:0 0 10px;">城市天气查询</h3>
            <form id="cityForm" class="row">
              <input id="cityInput" class="field" placeholder="输入城市名称（中文/英文均可）" required type="text"/>
              <button class="btn btn--primary" type="submit">查询天气并推荐</button>
            </form>
            <div id="result" class="result"></div>
          </section>

          <!-- Manual temp -->
          <section class="card" aria-label="Manual temperature">
            <h3 style="margin:0 0 10px;">手动输入气温</h3>
            <form id="manualForm" class="row">
              <input id="manualTemp" class="field" placeholder="输入气温 (℃)" required type="number" step="0.1"/>
              <button class="btn btn--primary" type="submit">获取穿衣推荐</button>
            </form>
            <div id="manualResult" class="result"></div>
          </section>

          <!-- Debug log -->
          <section class="card" aria-label="Debug log">
            <h3 style="margin:0 0 10px;">调试日志</h3>
            <div id="log" class="mutedText">无日志信息</div>
          </section>
        </div>

        <script>
          /***********************
           * SmartWear v2
           ***********************/
          const targetTemp = 26;

          const wardrobe = {
            baseTop: [
              { name: "短袖T恤", warmth: 1.0, styles: ["any","minimal","sporty","street"] },
              { name: "POLO衫", warmth: 1.2, styles: ["any","commute","minimal"] },
              { name: "短袖衬衫", warmth: 1.1, styles: ["any","commute","street"] },
              { name: "长袖T恤", warmth: 1.8, styles: ["any","minimal","sporty","street"] },
              { name: "薄款打底衫", warmth: 2.0, styles: ["any","minimal","commute"] },
              { name: "薄款衬衫", warmth: 2.0, styles: ["any","commute","minimal"] },
              { name: "保暖内衣上衣", warmth: 3.0, styles: ["any","outdoor","minimal"] }
            ],
            midTop: [
              { name: "针织开衫", warmth: 2.6, styles: ["any","commute","minimal"] },
              { name: "薄毛衣", warmth: 3.0, styles: ["any","commute","minimal"] },
              { name: "卫衣", warmth: 3.2, styles: ["any","sporty","street"] },
              { name: "法兰绒衬衫外搭", warmth: 2.8, styles: ["any","street","outdoor"] },
              { name: "轻薄羽绒马甲", warmth: 3.6, styles: ["any","outdoor","commute"] },
              { name: "抓绒上衣", warmth: 4.0, styles: ["any","outdoor","sporty"] }
            ],
            outer: [
              { name: "薄外套（防风）", warmth: 2.8, styles: ["any","sporty","outdoor","street"], rainOk: true },
              { name: "牛仔夹克", warmth: 3.2, styles: ["any","street","minimal"] },
              { name: "棒球夹克", warmth: 3.0, styles: ["any","street","sporty"] },
              { name: "西装外套", warmth: 2.6, styles: ["commute","minimal"] },
              { name: "风衣", warmth: 3.4, styles: ["commute","minimal","any"], rainOk: true },
              { name: "呢子大衣", warmth: 5.0, styles: ["commute","minimal"] },
              { name: "棉服", warmth: 6.0, styles: ["any","outdoor"] },
              { name: "厚羽绒服", warmth: 8.5, styles: ["any","outdoor"], rainOk: true }
            ],
            bottom: [
              { name: "短裤", warmth: 0.6, styles: ["any","sporty","street"] },
              { name: "薄款休闲长裤", warmth: 1.6, styles: ["any","minimal","commute"] },
              { name: "牛仔裤", warmth: 2.0, styles: ["any","street","minimal"] },
              { name: "运动长裤", warmth: 1.8, styles: ["any","sporty"] },
              { name: "西裤", warmth: 1.8, styles: ["commute","minimal"] },
              { name: "工装裤", warmth: 2.2, styles: ["street","outdoor","any"] },
              { name: "加绒长裤", warmth: 3.4, styles: ["any","outdoor"] },
              { name: "保暖秋裤（打底）", warmth: 2.4, styles: ["any","outdoor","minimal"], isBaseBottom: true }
            ],
            accessory: [
              { name: "雨伞", warmth: 0.0, styles: ["any"], rainOnly: true },
              { name: "防水外套/雨衣", warmth: 2.4, styles: ["any","outdoor"], rainOnly: true, rainOk: true },
              { name: "帽子", warmth: 0.8, styles: ["any","street","sporty","outdoor"] },
              { name: "围巾", warmth: 1.2, styles: ["any","commute","minimal"] },
              { name: "手套", warmth: 1.2, styles: ["any","outdoor"] }
            ]
          };

          function logMsg(msg) {
            document.getElementById("log").textContent = msg;
          }
          function pickByStyle(items, style) {
            if (!style || style === "any") return items.slice();
            const hit = items.filter(x => (x.styles || []).includes(style));
            return hit.length >= 3 ? hit : items.slice();
          }
          function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }

          function recommendOutfits(temp, { raining=false, style="any" } = {}) {
            const need = clamp(targetTemp - temp + (raining ? 1.0 : 0.0), 0, 14);

            const baseTops = pickByStyle(wardrobe.baseTop, style);
            const midTops  = pickByStyle(wardrobe.midTop, style);
            const outers   = pickByStyle(wardrobe.outer, style);
            const bottoms  = pickByStyle(wardrobe.bottom, style);
            const accs     = pickByStyle(wardrobe.accessory, style);

            function chooseBottom(targetWarmth) {
              let useBaseBottom = targetWarmth >= 5.5;
              const baseBottom = bottoms.find(b => b.isBaseBottom);
              const outerBottomCandidates = bottoms.filter(b => !b.isBaseBottom);

              const scored = outerBottomCandidates
                .map(b => ({ b, score: Math.abs((b.warmth) - clamp(targetWarmth*0.35, 0.5, 3.6)) }))
                .sort((x,y) => x.score - y.score);

              const chosenOuter = scored[0]?.b || outerBottomCandidates[0];

              const items = [];
              let warmth = 0;

              if (useBaseBottom && baseBottom) {
                items.push(baseBottom);
                warmth += baseBottom.warmth;
              }
              items.push(chosenOuter);
              warmth += chosenOuter.warmth;

              return { items, warmth };
            }

            function chooseTopLayers(targetWarmth) {
              const wantOuter = targetWarmth >= 4.0;
              const wantMid   = targetWarmth >= 2.2;

              let basePool = baseTops;
              if (targetWarmth <= 1.2) basePool = baseTops.filter(x => ["短袖T恤","POLO衫","短袖衬衫"].includes(x.name));
              else if (targetWarmth <= 3.0) basePool = baseTops.filter(x => ["长袖T恤","薄款打底衫","薄款衬衫"].includes(x.name));
              else basePool = baseTops.filter(x => x.name.includes("保暖内衣") || x.name.includes("打底"));
              if (basePool.length === 0) basePool = baseTops;

              const base = basePool[Math.floor(Math.random() * basePool.length)];
              const items = [base];
              let warmth = base.warmth;

              if (wantMid) {
                const mid = midTops[Math.floor(Math.random() * midTops.length)];
                items.push(mid);
                warmth += mid.warmth;
              }

              if (wantOuter) {
                let outerPool = outers;
                if (raining) {
                  const rainOk = outers.filter(o => o.rainOk);
                  if (rainOk.length) outerPool = rainOk;
                }
                const outer = outerPool[Math.floor(Math.random() * outerPool.length)];
                items.push(outer);
                warmth += outer.warmth;
              }

              return { items, warmth };
            }

            function chooseAccessories(targetWarmth) {
              const items = [];

              if (raining) {
                const rainCandidates = accs.filter(a => a.rainOnly);
                if (rainCandidates.length) {
                  items.push(rainCandidates[Math.floor(Math.random() * rainCandidates.length)]);
                } else {
                  items.push({ name: "雨伞", warmth: 0.0 });
                }
              }

              if (targetWarmth >= 6.5) {
                const coldSet = accs.filter(a => !a.rainOnly && ["围巾","手套","帽子"].includes(a.name));
                if (coldSet.length) {
                  items.push(coldSet[Math.floor(Math.random() * coldSet.length)]);
                  if (Math.random() > 0.45) items.push(coldSet[Math.floor(Math.random() * coldSet.length)]);
                }
              }

              const warmth = items.reduce((s,x) => s + (x.warmth || 0), 0);
              return { items, warmth };
            }

            const plans = [];
            for (let i = 0; i < 3; i++) {
              const bottom = chooseBottom(need);
              const top = chooseTopLayers(need);
              const acc = chooseAccessories(need);

              const totalWarmth = bottom.warmth + top.warmth + acc.warmth;
              plans.push({
                top: top.items,
                bottom: bottom.items,
                acc: acc.items,
                score: Math.abs(totalWarmth - need),
                totalWarmth
              });
            }

            const uniq = [];
            const seen = new Set();
            for (const p of plans.sort((a,b)=>a.score-b.score)) {
              const key = [
                p.top.map(x=>x.name).join("+"),
                p.bottom.map(x=>x.name).join("+"),
                p.acc.map(x=>x.name).join("+")
              ].join("|");
              if (!seen.has(key)) { uniq.push(p); seen.add(key); }
            }

            return { needWarmth: need, plans: uniq.slice(0,3) };
          }

          async function geocodeCity(city) {
            const geoUrl =
              `https://geocoding-api.open-meteo.com/v1/search` +
              `?name=${encodeURIComponent(city)}` +
              `&count=1&language=zh&format=json`;

            const res = await fetch(geoUrl);
            logMsg(`Geocoding 状态码: ${res.status}`);
            if (!res.ok) throw new Error(`城市解析失败，状态码: ${res.status}`);

            const data = await res.json();
            if (!data.results || data.results.length === 0) {
              throw new Error("未找到该城市，请尝试更具体的名称（如：北京/上海/深圳）");
            }

            const r = data.results[0];
            return {
              name: r.name,
              admin1: r.admin1,
              country: r.country,
              latitude: r.latitude,
              longitude: r.longitude
            };
          }

          async function fetchWeather(city) {
            const loc = await geocodeCity(city);

            const forecastUrl =
              `https://api.open-meteo.com/v1/forecast` +
              `?latitude=${loc.latitude}` +
              `&longitude=${loc.longitude}` +
              `&daily=temperature_2m_min,temperature_2m_max,precipitation_probability_max` +
              `&timezone=auto`;

            const res = await fetch(forecastUrl);
            logMsg(`Forecast 状态码: ${res.status}`);
            if (!res.ok) throw new Error(`获取天气失败，状态码: ${res.status}`);

            const data = await res.json();
            const daily = data.daily;
            if (!daily || !daily.temperature_2m_min || !daily.temperature_2m_max) {
              throw new Error("天气数据格式异常（daily 缺失）");
            }

            const min_temp = Number(daily.temperature_2m_min[0]);
            const max_temp = Number(daily.temperature_2m_max[0]);

            let rain_probability = daily.precipitation_probability_max
              ? Number(daily.precipitation_probability_max[0])
              : 0;
            if (!Number.isFinite(rain_probability)) rain_probability = 0;

            const displayCity = [loc.name, loc.admin1, loc.country].filter(Boolean).join(" · ");
            return { city: displayCity, min_temp, max_temp, rain_probability };
          }

          function planToHTML(p, idx) {
            const topStr = p.top.map(x=>x.name).join(" + ");
            const bottomStr = p.bottom.map(x=>x.name).join(" + ");
            const accStr = p.acc.length ? p.acc.map(x=>x.name).join(" + ") : "无";
            return `
              <li style="margin:10px 0;">
                <b>方案${idx+1}</b>
                <div class="mutedText" style="margin-top:6px;">
                  上衣：${topStr}<br/>
                  裤子：${bottomStr}<br/>
                  配件：${accStr}<br/>
                  估算保暖值：${p.totalWarmth.toFixed(1)}
                </div>
              </li>
            `;
          }

          function renderResult(containerId, titleHTML, tempForNeed, raining) {
            const style = document.getElementById("styleSelect").value || "any";
            const { needWarmth, plans } = recommendOutfits(tempForNeed, { raining, style });

            const el = document.getElementById(containerId);
            if (!el) return;

            const rainLine = raining
              ? `<span class="tag">雨天</span><span class="mutedText">已开启雨天加权（更偏向防水外套/雨具）</span>`
              : `<span class="tag">非雨天</span><span class="mutedText">默认干爽</span>`;

            el.innerHTML = `
              ${titleHTML}
              <div style="margin:10px 0;">${rainLine}</div>
              <div class="mutedText">目标保暖值（相对）≈ <b>${needWarmth.toFixed(1)}</b></div>
              <h4 style="margin:12px 0 6px;">推荐穿搭（必含上衣+裤子）：</h4>
              <ol style="margin:0; padding-left:18px;">
                ${plans.map((p,i)=>planToHTML(p,i)).join("")}
              </ol>
            `;
          }

          document.getElementById("cityForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const city = document.getElementById("cityInput").value.trim();
            const resultDiv = document.getElementById("result");
            if (!city) return;

            resultDiv.innerHTML = `<div class="loading">加载中，请稍候...</div>`;

            try {
              const { city: displayCity, min_temp, max_temp, rain_probability } = await fetchWeather(city);
              const avg_temp = (min_temp + max_temp) / 2;
              const raining = rain_probability > 50;

              const titleHTML = `
                <h3 style="margin:0 0 6px;">
                  ${displayCity} 今日气温：<b>${min_temp.toFixed(1)}℃ - ${max_temp.toFixed(1)}℃</b>
                </h3>
                <div class="mutedText">降雨概率：${rain_probability}%（按 ${avg_temp.toFixed(1)}℃ 估算）</div>
              `;

              const adjustedTemp = avg_temp - (raining ? 0.8 : 0.0);
              renderResult("result", titleHTML, adjustedTemp, raining);
            } catch (err) {
              resultDiv.innerHTML = `<div class="mutedText" style="color:#b42318;">${err.message}</div>`;
            }
          });

          document.getElementById("manualForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const val = parseFloat(document.getElementById("manualTemp").value);
            if (Number.isNaN(val)) return;

            const titleHTML = `<h3 style="margin:0 0 6px;">输入气温：<b>${val.toFixed(1)}℃</b></h3>`;
            renderResult("manualResult", titleHTML, val, false);
          });
        </script>
      </div>
    </div>
  </main>

  <div id="authorModal" class="modal" aria-hidden="true">
    <div id="authorModalContent" class="modal__content" role="dialog" aria-modal="true" aria-labelledby="authorTitle">
      <div class="modal__head">
        <h3 id="authorTitle">关于作者</h3>
        <button id="authorClose" class="modal__close" aria-label="Close">✕</button>
      </div>
      <p id="authorText" class="modal__body">嗨，这里是 Ryan。</p>
      <div class="modal__actions">
        <a class="btn btn--primary" href="index.html#contact">Contact</a>
        <a class="btn" href="index.html#tools">Tools</a>
      </div>
    </div>
  </div>

  <!-- ✅ 确保路径正确：SmartWear26.html 和 app.js 必须在同一目录；不在同一目录就改成 ../app.js 或 /app.js -->
  <script src="app.js"></script>
</body>
</html>
